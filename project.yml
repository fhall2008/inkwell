name: Inkwell
options:
  bundleIdPrefix: au.com.neurofaith
  deploymentTarget:
    iOS: "17.5"   # Apple Pencil Pro squeeze and barrel roll need iPadOS 17.5+
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INKWELL_SERVER_URL: ""   # the sync server address; the build workflow fills it from INKWELL_API_URL
targets:
  Inkwell:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.neurofaith.inkwell   # must match the App Store Connect app
        TARGETED_DEVICE_FAMILY: "2"                                  # iPad only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Inkwell
        InkwellServerURL: $(INKWELL_SERVER_URL)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Inkwell uses the camera so you can take a photo and place it on a note page.
        NSMicrophoneUsageDescription: Inkwell uses the microphone so you can dictate text into a note.
        NSSpeechRecognitionUsageDescription: Inkwell turns your speech into text that you can place on a note page.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
