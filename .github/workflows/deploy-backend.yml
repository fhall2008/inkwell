name: Deploy sync backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Create the bucket and database if they don't exist yet
        run: |
          npx wrangler r2 bucket create inkwell-notes || echo "bucket already exists"
          npx wrangler d1 create inkwell || echo "database already exists"

      - name: Point wrangler.toml at the database
        run: |
          DB_ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8")); const d=l.find(x=>x.name==="inkwell"); if(!d){process.exit(1)} console.log(d.uuid)')
          echo "Database ID found"
          sed -i "s/REPLACE_WITH_D1_ID/$DB_ID/" wrangler.toml

      - name: Create or update the tables
        run: npx wrangler d1 execute inkwell --remote --file=schema.sql

      - name: Upgrade tables created by an earlier version
        run: |
          # CREATE TABLE IF NOT EXISTS never adds columns to a table that already exists.
          if ! npx wrangler d1 execute inkwell --remote --command "SELECT purpose FROM invites LIMIT 1" > /dev/null 2>&1; then
            echo "Adding the missing 'purpose' column to invites"
            npx wrangler d1 execute inkwell --remote --command "ALTER TABLE invites ADD COLUMN purpose TEXT NOT NULL DEFAULT 'register'"
          else
            echo "Tables are up to date"
          fi

      - name: Deploy the Worker
        run: npx wrangler deploy

      - name: Set the sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: printf '%s' "$SYNC_TOKEN" | npx wrangler secret put SYNC_TOKEN
